<style>

:root{--navy:#0b1b2e;--navy2:#12263d;--navy3:#1b3553;--line:#e3e8ef;--ink:#0f1c2b;--ink2:#41526a;--mute:#6b7a90;--bg:#f4f6f9;--card:#fff;
--teal:#1fb5a3;--teal2:#14907f;--tealbg:#e6f7f4;--blue:#3d7bdc;--bluebg:#e9f1fd;--amber:#c98a12;--amberbg:#fdf4e0;--red:#d0453c;--redbg:#fdecea;--green:#1d9a5b;--greenbg:#e6f6ee;
--r:12px;--sh:0 1px 2px rgba(15,28,43,.06),0 4px 14px rgba(15,28,43,.05);--font:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Manrope','DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font:15px/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:var(--teal2);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;line-height:1.25;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .8em}small,.muted{color:var(--mute)}.muted{font-size:14px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.loading{padding:80px 20px;text-align:center;color:var(--mute)}
.pulse{display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--teal);animation:pl 1s infinite ease-in-out}
@keyframes pl{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
#net{position:fixed;top:0;left:0;height:4px;width:0;background:linear-gradient(90deg,var(--teal),#7dd3fc,var(--blue),var(--teal));background-size:300% 100%;z-index:130;transition:width .3s,opacity .3s;opacity:0;border-radius:0 3px 3px 0;box-shadow:0 0 10px rgba(31,181,163,.6)}
#net.on{width:78%;opacity:1;transition:width 9s cubic-bezier(.1,.6,.2,1);animation:netflow 1.6s linear infinite}
@keyframes netflow{0%{background-position:0 0}100%{background-position:300% 0}}
#workpill{position:fixed;right:22px;bottom:22px;z-index:125;background:#fff;border:1px solid var(--line,#e2e8f0);border-radius:14px;padding:12px 16px 14px;min-width:260px;max-width:92vw;
  box-shadow:0 12px 40px rgba(9,22,38,.18);opacity:0;transform:translateY(12px);pointer-events:none;transition:.25s}
#workpill.show{opacity:1;transform:none}
#workpill .wp-t{font-size:13.5px;font-weight:600;color:var(--navy,#0d1a2f);display:flex;align-items:center;gap:8px;margin-bottom:9px}
#workpill .wp-dot{width:9px;height:9px;border-radius:50%;background:var(--teal,#1fb5a3);box-shadow:0 0 0 0 rgba(31,181,163,.6);animation:wpulse 1.2s infinite}
@keyframes wpulse{0%{box-shadow:0 0 0 0 rgba(31,181,163,.55)}100%{box-shadow:0 0 0 9px rgba(31,181,163,0)}}
#workpill .wp-bar{height:6px;border-radius:6px;background:#e9f7f5;overflow:hidden;position:relative}
#workpill .wp-bar i{position:absolute;top:0;bottom:0;width:38%;border-radius:6px;background:linear-gradient(90deg,var(--teal,#1fb5a3),var(--blue,#2563eb));animation:wpslide 1.25s ease-in-out infinite}
#toast.show.click{pointer-events:auto;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
#workpill .wp-bar.det i{animation:none;left:0;transition:width .5s ease}
@keyframes wpslide{0%{left:-40%}100%{left:102%}}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:7px;vertical-align:-2px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn[data-busy]{opacity:.85;cursor:progress}
.form-err{margin:0 0 12px}
.need input,.need select{border-color:var(--red,#dc2626)!important;background:#fff7f7}
@media (prefers-reduced-motion:reduce){#net.on,#workpill .wp-bar i,.spin,#workpill .wp-dot{animation:none}}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;max-width:92vw;
  box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.25s;z-index:120}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.error{background:var(--red)}#toast.ok{background:var(--green)}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--teal);color:#fff;font:600 14px var(--font);padding:9px 15px;border-radius:9px;cursor:pointer;
  white-space:nowrap;text-decoration:none!important;transition:background .15s,box-shadow .15s}
.btn:hover{background:var(--teal2)}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{background:#f1f4f8}
.btn.danger{background:#fff;color:var(--red);border-color:#f3c8c4}.btn.danger:hover{background:var(--redbg)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}.btn.xs{padding:3px 8px;font-size:12px;border-radius:7px}
.btn.block{width:100%;justify-content:center}.btn.link{background:none;color:var(--teal2);padding:0;border:0}.btn.link:hover{text-decoration:underline;background:none}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 5px}
input,select,textarea{width:100%;font:15px var(--font);color:var(--ink);background:#fff;border:1px solid #cfd8e3;border-radius:9px;padding:9px 11px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,181,163,.15)}
textarea{min-height:80px;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--teal);margin:0 6px 0 0;vertical-align:-2px}
input[type=file]{padding:7px;background:#fafbfc}
.check{display:flex;align-items:flex-start;gap:4px;font-weight:500;color:var(--ink);font-size:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
.hint{font-size:12.5px;color:var(--mute);margin-top:4px}
form .grid{margin-bottom:14px}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:#eef1f5;color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--greenbg);color:var(--green)}.chip.bad{background:var(--redbg);color:var(--red)}.chip.warn{background:var(--amberbg);color:var(--amber)}
.chip.info{background:var(--bluebg);color:var(--blue)}.chip.teal{background:var(--tealbg);color:var(--teal2)}
.idtag{font:600 11.5px ui-monospace,Menlo,monospace;color:var(--mute);background:#f1f4f8;border-radius:6px;padding:1px 6px;cursor:pointer}

.pub{min-height:100vh;background:radial-gradient(1200px 600px at 80% -10%,#17446a 0,transparent 60%),linear-gradient(160deg,var(--navy) 0,#0a2340 100%);color:#e9f0f8}
.pub a{color:#7fe3d4}.pub a.btn{color:#fff}.pub .card a.btn,.pub .card .btn.ghost{color:var(--ink)}.pub .card .btn:not(.ghost):not(.danger){color:#fff}
.pub-top{display:flex;align-items:center;justify-content:space-between;max-width:1180px;margin:0 auto;padding:18px 22px}
.brand{display:flex;align-items:center;gap:10px;font:800 19px var(--head);color:#fff;letter-spacing:-.02em}.brand b{color:#5fe0cb;font-weight:800}
.brand .logo{width:32px;height:32px;flex:none}
.hero{max-width:1180px;margin:0 auto;padding:46px 22px 30px;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center}
.hero h1{font-size:44px;color:#fff;letter-spacing:-.03em}.hero h1 em{font-style:normal;color:#5fe0cb}
.hero p.lead{font-size:18px;color:#c3d2e3;max-width:560px}
.hero .btns{margin-top:22px}.pub .btn.ghost{background:transparent;color:#fff;border-color:#36597d}.pub .btn.ghost:hover{background:#163352}
.mock{background:#fff;color:var(--ink);border-radius:16px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mock .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.mock .row:last-child{border:0}
.feats{max-width:1180px;margin:0 auto;padding:20px 22px 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px}
.feat h3{color:#fff;display:flex;gap:8px;align-items:center}.feat h3 svg{color:#5fe0cb}.feat p{color:#b6c6d8;font-size:14px;margin:0}
.auths{max-width:1180px;margin:0 auto;padding:0 22px 50px}
.auths .chip{background:rgba(255,255,255,.08);color:#dce6f1;margin:0 6px 8px 0;font-size:13px;padding:5px 12px}
.foot{text-align:center;color:#8aa0b8;font-size:13px;padding:24px}
.auth{min-height:calc(100vh - 70px);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px}
.auth .card{width:100%;max-width:430px;color:var(--ink)}.auth .card h2{margin-bottom:4px}
.auth .alt{margin-top:14px;font-size:14px;text-align:center;color:var(--mute)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.card.tight{padding:14px 16px}.card h3{display:flex;align-items:center;gap:8px}
.mgrid{width:100%;border-collapse:collapse;table-layout:fixed}.mgrid th{font-size:12px;padding:4px;color:var(--mute)}.mgrid td{border:1px solid var(--line);vertical-align:top;padding:4px 5px;height:64px}
.mgrid .mg-empty{background:#f8fafc}.mgrid .we{background:#fbfcfd}.mg-n{font-size:11.5px;color:var(--mute);margin-bottom:2px}.mgrid input{width:100%;padding:3px 5px;font-size:13px;margin-top:2px;height:26px}.mg-wt{text-align:center;font-weight:700;vertical-align:middle!important;width:70px}
.ts-sum{margin:4px 0 14px;padding:10px 12px;border-radius:var(--r);background:var(--bg,#f5f7fa);border:1px solid var(--line);font-size:13.5px;line-height:1.6}.ts-sum svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px}.warn-txt{color:var(--amber)}.bad-txt{color:var(--red)}
.sched-note{font-size:12.5px;font-weight:500;color:var(--amber);margin-top:4px;display:flex;gap:5px;align-items:flex-start}.sched-note.bad{color:var(--red)}.sched-note svg{width:14px;height:14px;flex:none;margin-top:2px}
.sched-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--bg,#f5f7fa);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}.sched-status>div>div{margin-top:3px;font-weight:600}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.card-h h3{margin:0}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;background:var(--bluebg);color:#24508f}
.banner.info{background:var(--bluebg);color:#1d4f91}
.kv dd.ie{cursor:pointer;border-radius:7px;padding:2px 28px 2px 6px;margin:-2px -6px;position:relative;transition:background .12s}
.kv dd.ie:hover,.kv dd.ie:focus{background:var(--tealbg);outline:none}.kv dd.ie .ie-pen{position:absolute;right:6px;top:3px;color:var(--teal);opacity:0;transition:opacity .12s}.kv dd.ie .ie-pen svg{width:14px;height:14px}
.kv dd.ie:hover .ie-pen,.kv dd.ie:focus .ie-pen{opacity:1}.ie-add{display:inline-flex;align-items:center;gap:4px;font-weight:400}.ie-add svg{width:13px;height:13px}
.kv dd.ie.editing{cursor:default;background:var(--tealbg);padding:6px;margin:-4px -6px}.kv dd.ie.saving{opacity:.6;pointer-events:none}
.ie-ed{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.ie-ed input,.ie-ed select{flex:1 1 130px;min-width:0;padding:6px 9px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit}
.ie-ed input:focus,.ie-ed select:focus{outline:2px solid var(--teal);outline-offset:-1px}.ie-btns{display:inline-flex;gap:4px}.ie-btns svg{width:14px;height:14px;margin:0}
.ie-tip{margin:-6px 0 10px;display:flex;align-items:center;gap:5px}.ie-tip svg{width:13px;height:13px}
tr.pii-row{cursor:pointer}tr.pii-row:hover{background:var(--tealbg)}td.pii-pen{width:28px;color:var(--teal);opacity:0}tr.pii-row:hover td.pii-pen{opacity:1}td.pii-pen svg{width:14px;height:14px}
.banner.warn{background:var(--amberbg);color:#7a520a}.banner.bad{background:var(--redbg);color:#8d2a23}.banner.ok{background:var(--greenbg);color:#14653c}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--navy);color:#c5d3e3;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.side .brand{padding:4px 8px 16px}
.orgbox{background:var(--navy2);border-radius:10px;padding:10px 12px;margin:0 2px 14px;font-size:13px}.orgbox b{display:block;color:#fff;font-size:14px}
.orgbox select{margin-top:6px;background:var(--navy3);color:#fff;border-color:#2c4a6c;font-size:13px;padding:5px 8px}
.nav a{display:flex;align-items:center;gap:10px;color:#c5d3e3;padding:9px 12px;border-radius:9px;font-weight:500;font-size:14.5px;text-decoration:none!important;margin-bottom:2px}
.nav a:hover{background:var(--navy2);color:#fff}.nav a.on{background:var(--navy3);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
.nav .n{margin-left:auto;background:var(--teal);color:#06231f;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px}
.nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6f86a0;padding:14px 12px 6px}
.side .me{margin-top:auto;border-top:1px solid #1f3a5a;padding:12px 8px 0;font-size:13px}.side .me b{color:#fff;display:block}
.side .me .btns{margin-top:8px}.side .me .btn{background:var(--navy2);border-color:#24425f;color:#dce6f1}
.main{padding:24px 28px 60px;min-width:0}
.topbar{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h1{font-size:25px;margin:0}.pagehead p{margin:2px 0 0;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:default}
.stat[data-action]{cursor:pointer}.stat[data-action]:hover{border-color:#bfe9e2}
.stat b{display:block;font:800 26px var(--head);color:var(--ink)}.stat span{font-size:13px;color:var(--mute)}
.stat.warn b{color:var(--amber)}.stat.bad b{color:var(--red)}.stat.ok b{color:var(--green)}

.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid #eef1f5;vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f8fafc}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}.tblwrap{overflow-x:auto;margin:0 -4px}
.who{display:flex;align-items:center;gap:10px}.who b{display:block;font-weight:600}.who small{display:block;font-size:12.5px}
.av{width:34px;height:34px;border-radius:50%;background:var(--tealbg);color:var(--teal2);display:inline-flex;align-items:center;justify-content:center;font:700 13px var(--head);flex:none}
.av.lg{width:56px;height:56px;font-size:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{width:auto;min-width:160px;padding:7px 10px;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--mute);font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;text-decoration:none!important}
.tabs a.on{color:var(--ink);border-color:var(--teal)}.tabs a .chip{margin-left:4px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:14px}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500;word-break:break-word}
.bar{height:7px;background:#e9edf2;border-radius:10px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--teal);border-radius:10px}

.task{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #eef1f5}.task:last-child{border:0}
.task .dot{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#eef1f5;color:var(--mute);margin-top:1px}
.task .dot.ok{background:var(--greenbg);color:var(--green)}.task .dot.warn{background:var(--amberbg);color:var(--amber)}.task .dot.bad{background:var(--redbg);color:var(--red)}.task .dot.info{background:var(--bluebg);color:var(--blue)}
.task .body{flex:1;min-width:0}.task .body b{font-weight:600}.task .meta{font-size:12.5px;color:var(--mute);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.task .help{font-size:13.5px;color:var(--ink2);margin-top:4px}.task .note{font-size:13px;margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--redbg);color:#8d2a23}
.task .resp{font-size:13px;margin-top:5px;color:var(--ink2)}.task .act{flex:none;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

async function runIntake(picked, empId, hashAt, prior) {
  const out = (prior || []).slice(), failed = [];
  let next = 0, done = 0;
  const show = () => longTask('Reading and sorting ' + picked.length + ' document' + (picked.length === 1 ? '' : 's') + ' — ' + done + ' of ' + picked.length + ' done', picked.length > 1 ? done / picked.length * 100 : undefined);
  const one = async p => {
    for (let attempt = 0; attempt < 2; attempt++) {
      try { return await call('classifyDocument', { employeeId: empId, file: p.data }); }
      catch (e) { if (attempt === 1 || !(e.code === 'NETWORK' || e.code === 'BUSY')) throw e; await new Promise(ok => setTimeout(ok, 3000)); }
    }
  };
  const worker = async () => { while (next < picked.length) { const p = picked[next++]; try { out.push(await one(p)); } catch (e) { failed.push({ p: p, why: e.message || String(e) }); } done++; show(); } };
  show();
  try { await Promise.all([worker(), worker()]); } finally { longTask(''); }
  S.intakeFailed = { picked: failed.map(f => f.p), empId: empId, hashAt: hashAt, out: out };
  const errs = failed.map(f => f.p.name + ': ' + f.why);
  if (!out.length) return doneAlert('Could not read ' + failed.length + ' document' + (failed.length === 1 ? '' : 's') + ' — click to try again. (' + errs.join(' · ') + ')', () => runIntake(S.intakeFailed.picked, empId, hashAt, []), true);
  const open = () => intakeReview(out, errs, empId);
  if (location.hash === hashAt && !S.modal && !document.hidden) return open();
  doneAlert('Sorted ' + out.length + ' document' + (out.length === 1 ? '' : 's') + (failed.length ? ' (' + failed.length + ' could not be read)' : '') + ' — check and file', async () => { if (location.hash !== hashAt) { location.hash = hashAt; await waitPainted(hashAt); } open(); });
}

async function readingCopy(file) {
  try {
    longTask('Preparing ' + file.name + ' for reading');
    const PDFLib = await loadPdfLib(), src = await PDFLib.PDFDocument.load(new Uint8Array(await file.arrayBuffer()), { ignoreEncryption: true });
    const pages = src.getPageCount();
    for (let n = Math.min(pages, 8); n >= 1; n = n > 2 ? Math.floor(n / 2) : n - 1) {
      const out = await PDFLib.PDFDocument.create(), cp = await out.copyPages(src, [...Array(n).keys()]); cp.forEach(p => out.addPage(p));
      const bytes = await out.save();
      if (bytes.length <= 4 * 1024 * 1024 || n === 1) return bytes.length <= 9 * 1024 * 1024 ? { file: { name: file.name.replace(/\.pdf$/i, '') + ' (reading copy).pdf', data: bytesToB64(bytes) }, note: n >= pages ? 'all ' + pages + ' pages' : (n === 1 ? 'page 1' : 'pages 1–' + n) + ' of ' + pages } : null;
    }
  } catch (e) { console.warn('reading copy', e); } finally { longTask(''); }
  return null;
}

  if (left.length && n) msgs.push('Page' + (left.length > 1 ? 's ' : ' ') + pagesText(left) + (left.length > 1 ? ' are' : ' is') + ' not in any document (left out of the pieces; still in the combined file).');
  w.innerHTML = msgs.length ? '<div class="banner warn">' + ic('alert') + '<div>' + msgs.map(esc).join('<br>') + '</div></div>' : '';
}
document.addEventListener('input', ev => { if (ev.target.closest && ev.target.closest('form[data-form="doc-split"]')) splitCheck(); });
Object.assign(ACTIONS, {
  'doc-split': el => { closeModal(); return splitModal(el.dataset.id, el); },
  'split-add': () => { const tb = document.getElementById('split-rows'); tb.insertAdjacentHTML('beforeend', S.split.row({ type: 'Other', pages: [] }, S.split.n++)); },
  'split-del': el => { const tr = el.closest('tr'); if (document.querySelectorAll('[data-split-row]').length > 1) tr.remove(); splitCheck(); }

FORMS['doc-split'] = async (v, form) => {
  const rows = splitRows(form).filter(r => r.pages.length);
  if (rows.length < 1) throw new Error('Say which pages belong to each document.');
  if (rows.length === 1 && rows[0].pages.length === S.split.total) throw new Error('That is the whole file — nothing to split. Use Edit to change its type instead.');
  if (!S.split.src) throw new Error('The PDF is still opening — wait a moment and try again.');
  const lib = S.split.lib, src = S.split.src, base = (S.split.P.fileName || 'document.pdf').replace(/\.pdf$/i, ''), ids = [];
  try {
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      longTask('Splitting: ' + r.type + ' (' + (i + 1) + ' of ' + rows.length + ')', i / rows.length * 100);
      const out = await lib.PDFDocument.create(), pages = await out.copyPages(src, r.pages.map(p => p - 1));
      pages.forEach(p => out.addPage(p));
      const bytes = await out.save(), name = (r.type.replace(/[\\/:*?"<>|]+/g, '-') + ' - ' + base + ' (p' + pagesText(r.pages) + ').pdf');
      const res = await call('addSplitPart', { id: S.split.id, type: r.type, pages: r.pages, expiresOn: r.expiresOn, issuedOn: r.issuedOn, file: await readFile(new File([bytes], name, { type: 'application/pdf' })) });
      ids.push(res.id);
    }
    const done = await call('finishSplit', { id: S.split.id, partIds: ids });
    closeModal(); toast('Split into ' + done.parts.length + ' documents: ' + done.parts.map(p => p.type).join(', '), 'ok', 6000);
  } finally { longTask(''); }
  await reloadCurrent();
};
const tsCanFix = t => !!t && !!t.id && t.status !== 'Approved' && can('timesheets.all');
function tsFixMenu(t, m) {
  if (!tsCanFix(t)) return '';
  return moreMenu('<button type="button" data-action="ts-replace-file" data-id="' + t.id + '">' + ic('upload') + 'Attach the right file</button>' +
    (m ? '<button type="button" data-action="ts-move-month" data-id="' + t.id + '" data-from="' + m + '">' + ic('calendar') + 'Move to another month</button>' : '') +
    '<button type="button" class="danger" data-action="ts-delete" data-id="' + t.id + '">' + ic('trash') + 'Delete this timesheet</button>');
}
function tsWrongFileBanner(t, m) {
  if (t && (t.fileMonths || []).length > 1) {   // a workbook with other months' tabs and none for this month
    const fm = t.fileMonths, span = monthTitle(fm[0]) + (fm.length > 1 ? ' – ' + monthTitle(fm[fm.length - 1]) : ''), fix = tsCanFix(t), rec = can('timesheets.all');
    return '<div class="banner bad">' + ic('alert') + '<div><b>Wrong file?</b> ' + esc(t.fileName) + ' is a workbook with ' + fm.length + ' monthly timesheets (' + esc(span) + ') — it has no hours for ' + esc(monthTitle(m)) + '.' +
      '<div class="btns" style="margin-top:8px">' + (rec ? '<button type="button" class="btn sm" data-action="ts-record-months" data-id="' + t.id + '" data-emp="' + esc(t.employeeId) + '">' + ic('calendar') + 'Record its ' + fm.length + ' months</button>' : '') +
      (fix ? '<button type="button" class="btn sm ghost" data-action="ts-replace-file" data-id="' + t.id + '">' + ic('upload') + 'Attach the ' + esc(monthTitle(m).split(' ')[0]) + ' file</button><button type="button" class="btn sm ghost danger" data-action="ts-delete" data-id="' + t.id + '">' + ic('trash') + 'Delete it</button>' : '') +
      '</div>' + (fix ? '<small class="muted">Record its months first, then attach ' + esc(monthTitle(m).split(' ')[0]) + '\'s own file here (or delete this one).</small>' : !rec ? ' Send it back so the right file is attached.' : '') + '</div></div>';
  }
  if (!t || !t.fileMonth || t.fileMonth === m) return '';
  const fix = tsCanFix(t);
  return '<div class="banner bad">' + ic('alert') + '<div><b>Wrong file?</b> ' + esc(t.fileName) + ' looks like the timesheet for <b>' + esc(monthTitle(t.fileMonth)) + '</b>, not ' + esc(monthTitle(m)) + '.' +
    (fix ? '<div class="btns" style="margin-top:8px"><button type="button" class="btn sm" data-action="ts-move-month" data-id="' + t.id + '" data-from="' + m + '" data-month="' + t.fileMonth + '">' + ic('calendar') + 'Move it to ' + esc(monthTitle(t.fileMonth)) + '</button>' +
      '<button type="button" class="btn sm ghost" data-action="ts-replace-file" data-id="' + t.id + '">' + ic('upload') + 'Attach the ' + esc(monthTitle(m).split(' ')[0]) + ' file</button>' +
      '<button type="button" class="btn sm ghost danger" data-action="ts-delete" data-id="' + t.id + '">' + ic('trash') + 'Delete it</button></div>'
      : ' Send it back so the right file is attached.') + '</div></div>';
}
async function tsFixReread(id) {
  try {
    const r = (await call('rereadTimesheets', { ids: [id], apply: true })).results[0] || {};
    if (!r.applied && !r.error) await call('rereadTimesheets', { ids: [id], apply: true, offline: true });   // the built-in reader as a second opinion

}
ACTIONS['ts-move-month'] = async btn => {
  const id = btn.dataset.id, from = btn.dataset.from;
  let month = btn.dataset.month;
  if (!month) {
    const v = await ask({ title: 'Move this timesheet to another month', body: 'The timesheet goes back to draft on the month you choose, and its hours are read again from the attached file.', input: { type: 'month', value: from, label: 'Month' }, ok: 'Move' });
    if (!v) return; month = String(v);
  } else if (!await ask({ title: 'Move it to ' + monthTitle(month) + '?', body: 'This timesheet moves from ' + monthTitle(from) + ' to ' + monthTitle(month) + ' as a draft, and its hours are read again from the file. ' + monthTitle(from) + ' is left without a timesheet.', ok: 'Move it', tone: 'warn' })) return;
  if (month === from) return;
  const r = await busy(btn, call('moveTimesheetMonth', { id: id, month: month }));
  await tsFixReread(id);
  toast('Moved to ' + monthTitle(month), 'ok');
  location.hash = location.hash.replace(/\d{4}-\d{2}(-\d{2})?$/, r.month);
  await reloadCurrent();
};
ACTIONS['ts-replace-file'] = async btn => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.pdf,.png,.jpg,.jpeg,.heic,.webp,.xlsx,.xls,.csv,.doc,.docx';
  inp.onchange = async () => {
    if (!inp.files[0]) return;

      await busy(btn, call('replaceTimesheetFile', { id: btn.dataset.id, file: await readFile(inp.files[0]) }));
    } catch (e) { if (e.code === 'TS_WRONG_FILE') return tsWrongFileAsk(e); throw e; }

  };

};
ACTIONS['ts-delete'] = async btn => {
  const v = await ask({ title: 'Delete this timesheet?', body: 'The timesheet and its file are removed. This is kept in the audit log.', input: { label: 'Reason (optional)', value: '' }, ok: 'Delete', tone: 'danger' });

function tsWrongFileAsk(e) {

ACTIONS['ts-record-months'] = async btn => {

  tsWeeksModal(btn.dataset.emp, r);

Object.assign(ACTIONS, {

document.addEventListener('click', async ev => {
  const shell = $('shell');
  if (shell && S.ui.open && ev.target === shell) { S.ui.open = false; shell.classList.remove('open'); }
  const el = ev.target.closest('[data-action]');

  const fn = ACTIONS[el.dataset.action]; if (!fn) return;

document.addEventListener('submit', async ev => {

  if (!name || !FORMS[name]) return;

  const dk = form.closest('.modal') ? draftKey(form) : '';

const onChange = async ev => { const el = ev.target.closest && ev.target.closest('[data-change]'); if (!el || !CHANGES[el.dataset.change]) return; try { await CHANGES[el.dataset.change](el, ev); } catch (e) { fail(e); } };
